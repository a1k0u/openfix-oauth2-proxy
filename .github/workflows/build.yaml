name: Build packages

on:
    workflow_dispatch:
    push:
        branches:
            - ci
            - master

jobs:
    build:
        runs-on: ubuntu-latest
        container:
          image: alkosenko/openfix-debian-ci:ci
          options: --privileged
        env:
          BASE_PATH: ${{ github.workspace }}/.cowbuilder/base.cow
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
            
            - name: Trust git repository
              run: |
                git config --global --add safe.directory ${{ github.workspace }}

            - name: Setup tmate session
              uses: mxschmitt/action-tmate@v3
              with:
                limit-access-to-actor: true

            - name: Init environment
              run: make init

            - name: Build packages
              run: make -j$(nproc)

            - name: Upload artifacts
              uses: actions/upload-artifact@v7
              with:
                name: build-artifacts
                path: |
                    *.deb
                    *.buildinfo
                    *.changes
                    *.dsc
                    *.build
                    *.source.changes
                    *.orig.tar.gz
                    *.debian.tar.xz
                    *.tar.gz
                    *.tar.xz

            - name: Create GitHub release
              if: github.ref == 'refs/heads/master'
              uses: softprops/action-gh-release@v2
              with:
                tag_name: ${{ github.sha }}
                name: ${{ github.sha }}
                prerelease: true
                generate_release_notes: true
                files: |
                    *.deb
                    *.buildinfo
                    *.changes
                    *.dsc
                    *.build
                    *.source.changes
                    *.orig.tar.gz
                    *.debian.tar.xz
                    *.tar.gz
                    *.tar.xz

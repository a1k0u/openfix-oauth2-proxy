name: Build Debian packages

on:
    workflow_dispatch:
    push:
        branches:
            - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
    build:
        runs-on: ubuntu-22.04
        container:
          image: alkosenko/openfix-debian-ci:ci
          options: --privileged
        env:
          BASE_PATH: ${{ github.workspace }}/.cowbuilder/base.cow
          APT_CACHE_PATH: ${{ github.workspace }}/.aptcache
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Trust git repository
              run: git config --global --add safe.directory '*'

            - name: Init environment
              run: make init

            - name: Build packages
              run: make -j$(nproc)

            - name: Upload artifacts
              uses: actions/upload-artifact@v7
              with:
                name: build-artifacts
                path: &artifacts |
                    *.deb
                    *.buildinfo
                    *.changes
                    *.dsc
                    *.build
                    *.tar.gz
                    *.tar.xz

            - name: Short SHA
              id: short-sha
              run: echo "sha16=$(git rev-parse --short=16 HEAD)" >> $GITHUB_OUTPUT

            - name: Create tag
              if: github.ref == 'refs/heads/master'
              run: |
                git tag ${{ steps.short-sha.outputs.sha16 }}
                git push origin ${{ steps.short-sha.outputs.sha16 }}

            - name: Create GitHub release
              if: github.ref == 'refs/heads/master'
              uses: softprops/action-gh-release@v2
              with:
                name: ${{ steps.short-sha.outputs.sha16 }}
                tag_name: ${{ steps.short-sha.outputs.sha16 }}
                prerelease: false
                make_latest: true
                generate_release_notes: true
                fail_on_unmatched_files: false
                files: *artifacts

    lint:
        runs-on: ubuntu-22.04
        needs: [ build ]
        container:
          image: alkosenko/openfix-debian-ci:ci
        steps:
            - name: Install lintian
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lintian

            - name: Download artifacts
              uses: actions/download-artifact@v7
              with:
                name: build-artifacts
                path: artifacts

            - name: Run lintian
              working-directory: artifacts
              run: lintian --info --display-info --fail-on error *.deb

    test:
        runs-on: ubuntu-22.04
        needs: [ build ]
        container:
          image: alkosenko/openfix-debian-ci:ci
          options: --privileged
        steps:
            - name: Install autopkgtest
              run: |
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends \
                  autopkgtest mmdebstrap uidmap util-linux

            - name: Download artifacts
              uses: actions/download-artifact@v7
              with:
                name: build-artifacts
                path: artifacts

            - name: Setup tmate session
              uses: mxschmitt/action-tmate@v3
              with:
                limit-access-to-actor: true

            - name: Run autopkgtest
              working-directory: artifacts
              run: |
                set +e
                autopkgtest oauth2-proxy_*_$(dpkg --print-architecture).changes \
                  -- unshare --release unstable
                rc=$?

                case $rc in
                  0) echo "All tests passed" ;;
                  2) echo "::warning::Some autopkgtest tests were skipped"; rc=0 ;;
                  8) echo "::warning::No autopkgtest tests defined"; rc=0 ;;
                esac

                exit $rc
